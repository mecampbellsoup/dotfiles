# ~/.config/tmuxinator/swarf.yml

name: swarf
root: ~/code/swarf/webapp
tmux_detached: false

on_project_start: cd ../business-vault && op run -- git pull
# Optional tmux socket
# socket_name: foo

# Note that the pre and post options have been deprecated and will be replaced by
# project hooks.

# Project hooks
# Runs on project start, always
# on_project_start: sudo openvpn3 session-manage --disconnect --config ~/kubespray.ovpn; sudo openvpn3 session-start --config ~/kubespray.ovpn
# Run on project start, the first time
# on_project_first_start: command
# Run on project start, after the first time
# on_project_restart: command
# Run on project exit ( detaching from tmux session )
# on_project_exit: sudo openvpn3 session-manage --disconnect --config ~/kubespray.ovpn
# Run on project stop
# on_project_stop: sudo openvpn3 session-manage --disconnect --config ~/kubespray.ovpn

# Runs in each window and pane before window/pane specific commands. Useful for setting up interpreter versions.
# pre_window: source .venv/bin/activate

# Pass command line options to tmux. Useful for specifying a different tmux.conf.
# tmux_options: -f ~/.tmux.mac.conf

# Change the command to call tmux.  This can be used by derivatives/wrappers like byobu.
# tmux_command: byobu

# Specifies (by name or index) which window will be selected on project startup. If not set, the first window is used.
# startup_window: editor

# Specifies (by index) which pane of the specified window will be selected on project startup. If not set, the first pane is used.
# startup_pane: 1

# Controls whether the tmux session should be attached to automatically. Defaults to true.
# attach: false

windows:
  - webapp:
      panes:
        - op run -- git pull --all
  - webapp-1:
      root: ~/code/swarf/webapp-dev
      panes:
        - op run -- git pull --all
  - webapp-2:
      root: ~/code/swarf/webapp-dev-2
      panes:
        - op run -- git pull --all
  - webapp-3:
      root: ~/code/swarf/webapp-dev-3
      panes:
        - op run -- git pull --all
  - webapp-4:
      root: ~/code/swarf/webapp-dev-4
      panes:
        - op run -- git pull --all
  - webapp-5:
      root: ~/code/swarf/webapp-dev-5
      panes:
        - op run -- git pull --all
  - webapp-6:
      root: ~/code/swarf/webapp-dev-6
      panes:
        - op run -- git pull --all
  - webapp-7:
      root: ~/code/swarf/webapp-dev-7
      panes:
        - op run -- git pull --all
  - webapp-8:
      root: ~/code/swarf/webapp-dev-8
      panes:
        - op run -- git pull --all
  # The macOS self-hosted runners (mac-native-arm64, -2) used to live here as
  # windows 10-11. Since 2026-08-19 CI, releases and deploys land on the
  # Hostinger Linux host instead (docs/CI.md), so the pair takes no work and
  # no longer starts with the session. They stay registered under `workstation`
  # as the rollback: flipping CI_RUNNER_OVERRIDE / DEPLOY_RUNNER_OVERRIDE back
  # is the whole procedure, plus starting the listeners again:
  #
  #   tmux new-window -d -t swarf -n runner-2 "cd ~/actions-runner-2 && env -i \
  #     HOME=$HOME USER=$USER LANG=en_US.UTF-8 TMPDIR=/tmp \
  #     PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin ./run.sh"
  #
  # Two constraints survive the move and must not be "simplified" on the way
  # back. They belong to a tmux pane in the login session, not to launchd:
  # launchd's SessionCreate detaches a listener from the login keychain, which
  # breaks `docker login ghcr.io` on every image job (Swarf-Inc/webapp#1753).
  # And `env -i` is load-bearing — .envrc runs `dotenv`, so a shell in any
  # worktree exports that worktree's whole .env; Compose resolves ${VAR} from
  # the environment before any .env file, and MINIO_PORT alone silently broke
  # deploy-check for 41 hours.
  #
  # Confirm listener state with `gh api repos/Swarf-Inc/webapp/actions/runners`
  # — GitHub lags local process state by a few seconds in both directions.
